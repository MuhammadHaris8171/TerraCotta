version: "3.8"
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: terracotta_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./terracotta/backend
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@db:5432/terracotta_db
      PORT: 4000
      JWT_SECRET: devsecret
    volumes:
      - ./terracotta/backend:/app
    command: npm run dev
    ports:
      - "4000:4000"
    depends_on:
      - db

  frontend:
    build:
      context: ./terracotta
    environment:
      VITE_API_BASE: http://localhost:4000/api
    volumes:
      - ./terracotta:/app
    command: npm run dev
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
